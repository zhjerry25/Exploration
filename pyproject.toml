[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stack-experiments"
version = "0.2.0"
description = "Dense-training and sparse-inference research framework for StackModel"
requires-python = ">=3.10"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
cuda = ["triton>=3.1; platform_system == 'Linux'"]

[project.scripts]
stack-experiment = "st.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["st*"]
